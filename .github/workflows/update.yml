name: Update Feed

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: feed-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
      FEED_TITLE: ${{ vars.FEED_TITLE }}
      FEED_LINK: ${{ vars.FEED_LINK }}
      FEED_DESCRIPITION: ${{ vars.FEED_DESCRIPITION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run update
        run: |
          go run ./app

      - name: Commit and push if changed
        id: commit
        run: |
          if git diff --quiet; then
            echo "No changes"
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data feed.xml
          git commit -m "Update feed"
          git push
          echo "updated=true" >> "$GITHUB_OUTPUT"

      - name: Prepare Pages site
        run: |
          mkdir -p _site
          cp index.html feed.xml _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify via WhatsApp
        if: steps.commit.outputs.updated == 'true'
        env:
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: |
          python3 - <<'PYEOF'
          import os
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET

          try:
              root = ET.parse("feed.xml").getroot()
              item = root.find("./channel/item")
              title = item.findtext("title") or "New entry"
              link = item.findtext("link") or ""
              message = f"Wapuugotchi RSS: {title}\n{link}"

              params = {
                  "phone": os.environ["CALLMEBOT_PHONE"],
                  "text": message,
                  "apikey": os.environ["CALLMEBOT_APIKEY"],
              }
              url = "https://api.callmebot.com/whatsapp.php?" + urllib.parse.urlencode(params)
              with urllib.request.urlopen(url, timeout=15) as resp:
                  print(resp.status, resp.read().decode(errors="replace"))
          except Exception as exc:
              print(f"WhatsApp notification failed (non-fatal): {exc}")
          PYEOF
